
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Champions 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071526;color:white;font-family:Arial,sans-serif}
#game{width:100%;height:100vh;position:relative;overflow:hidden}
canvas{display:block}
.panel{
 position:absolute;top:12px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:8px;
 pointer-events:none
}
.info{
 background:#061323dd;padding:10px 13px;border-radius:12px;
 border:1px solid #ffffff35;font-size:13px
}
.info strong{font-size:19px;color:#55ff9b}
#message{
 position:absolute;top:26%;width:100%;text-align:center;
 font-size:25px;font-weight:bold;text-shadow:0 2px 8px black;
 pointer-events:none
}
.controls{
 position:absolute;bottom:20px;left:0;right:0;
 display:flex;justify-content:center;gap:14px;padding:10px
}
button{
 border:0;border-radius:14px;padding:15px 24px;
 font-size:16px;font-weight:bold;cursor:pointer;
 color:white;background:#087d49;box-shadow:0 4px 12px #0007
}
button:active{transform:scale(.95)}
#shot{background:#f08b13;font-size:21px;padding:18px 38px}
#start{background:#087d49}
#help{
 position:absolute;bottom:92px;text-align:center;width:100%;
 font-size:12px;color:#fff;text-shadow:0 2px 5px black
}
#startScreen{
 position:absolute;inset:0;background:#071526eF;
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:20px
}
.card{
 width:min(400px,95%);padding:25px;background:#102b40;
 border:1px solid #4b8b87;border-radius:22px
}
.card h1{color:#5bffa6;font-size:29px}
.card p{line-height:1.6;color:#d4e8e7}
</style>
</head>
<body>
<div id="game">

 <div class="panel">
  <div class="info">
   <div id="player">PLAYER 1 BATTING</div>
   <strong id="score">0 / 0</strong>
   <div id="overs">Overs: 0.0</div>
  </div>
  <div class="info" style="text-align:right">
   <div>CRICKET 3D</div>
   <strong id="target">Target: -</strong>
   <div id="innings">1st Innings</div>
  </div>
 </div>

 <div id="message">CRICKET CHAMPIONS 3D</div>

 <div id="help">Tap SHOT or press SPACE when the ball approaches!</div>

 <div class="controls">
  <button id="shot">🏏 SHOT</button>
 </div>

 <div id="startScreen">
  <div class="card">
   <h1>🏏 CRICKET CHAMPIONS 3D</h1>
   <p>3D Local Multiplayer Cricket Game</p>
   <p>Player 1 vs Player 2<br>
   Six balls per innings · Two wickets</p>
   <p>Mobile + PC supported</p>
   <button id="start">START MATCH ▶</button>
  </div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const game = document.getElementById("game");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x82c8ef);
scene.fog = new THREE.Fog(0x82c8ef, 30, 85);

const camera = new THREE.PerspectiveCamera(
 55, innerWidth/innerHeight, 0.1, 1000
);
camera.position.set(0, 8, 16);
camera.lookAt(0, 1, -1);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
game.prepend(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff,0x34552b,2));

const sunlight = new THREE.DirectionalLight(0xffffff,2);
sunlight.position.set(-8,15,8);
sunlight.castShadow=true;
scene.add(sunlight);

// Ground
function box(w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0x228b3c})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Stadium boundary
const boundary = new THREE.Mesh(
 new THREE.RingGeometry(12,12.35,100),
 new THREE.MeshStandardMaterial({color:0xffffff})
);
boundary.rotation.x=-Math.PI/2;
boundary.position.y=.04;
scene.add(boundary);

// Cricket pitch
box(5,.08,18,0xd5b78c,0,0.05,-1);
box(3,.03,13,0xc9a77b,0,.11,-1);

// Pitch lines
box(4,.04,.12,0xffffff,0,.15,7);
box(4,.04,.12,0xffffff,0,.15,-9);

// Wickets
function makeWickets(z){
 for(let x=-.35;x<=.36;x+=.35){
  const stump=new THREE.Mesh(
   new THREE.CylinderGeometry(.055,.055,1.05,12),
   new THREE.MeshStandardMaterial({color:0xffffff})
  );
  stump.position.set(x,.55,z);
  scene.add(stump);
 }
 box(.85,.07,.12,0xffd34d,0,1.1,z);
}
makeWickets(5);
makeWickets(-9);

// Stadium seats
for(let i=0;i<28;i++){
 const angle=i/28*Math.PI*2;
 const x=Math.sin(angle)*19;
 const z=Math.cos(angle)*19;
 const stand=box(3,2,2, i%2?0x274a70:0x344d80,x,1,z);
 stand.rotation.y=-angle;
}

// Player characters
function makePlayer(x,y,z,shirtColor){
 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.48,1.3,16),
  new THREE.MeshStandardMaterial({color:shirtColor})
 );
 body.position.y=1.3;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.3,16,16),
  new THREE.MeshStandardMaterial({color:0xd5a078})
 );
 head.position.y=2.15;
 group.add(head);

 const legMat=new THREE.MeshStandardMaterial({color:0xffffff});
 for(let side of [-1,1]){
  const leg=new THREE.Mesh(
   new THREE.CylinderGeometry(.13,.16,.8,10),legMat
  );
  leg.position.set(side*.2,.4,0);
  group.add(leg);
 }
 group.position.set(x,y,z);
 scene.add(group);
 return group;
}

const batsman=makePlayer(0,0,3.9,0x1262e8);
batsman.rotation.y=Math.PI;

const bowler=makePlayer(0,0,-7,0xff3434);

// Bat
const batPivot=new THREE.Group();
batPivot.position.set(.55,1.35,3.9);
scene.add(batPivot);

const bat=new THREE.Mesh(
 new THREE.BoxGeometry(.18,.13,1.5),
 new THREE.MeshStandardMaterial({color:0xe6b66d})
);
bat.position.z=-.55;
bat.rotation.x=.15;
batPivot.add(bat);

// Cricket ball
const ball=new THREE.Mesh(
 new THREE.SphereGeometry(.19,24,24),
 new THREE.MeshStandardMaterial({
  color:0xc91e27,roughness:.4
 })
);
scene.add(ball);
ball.visible=false;

// Boundary ropes
const ballLight=new THREE.PointLight(0xffffff,0,5);
scene.add(ballLight);

// Game state
let inning=1;
let score=0;
let wickets=0;
let balls=0;
let target=0;
let active=false;
let ballFlying=false;
let hitDone=false;
let ballZ=-7;
let ballX=0;
let ballY=1;
let hitVelocity=0;
let swingTime=0;
let gameOver=false;
let nextBallTimer=0;

const $=id=>document.getElementById(id);

function updateUI(){
 $("score").textContent=score+" / "+wickets;
 $("overs").textContent="Overs: "+Math.floor(balls/6)+"."+(balls%6);
 $("target").textContent=inning===1?"Target: -":"Target: "+target;
 $("innings").textContent=inning===1?"1st Innings":"2nd Innings";
 $("player").textContent=inning===1?
 "PLAYER 1 BATTING":"PLAYER 2 BATTING";
}

function say(text){
 $("message").textContent=text;
}

function startMatch(){
 inning=1;
 score=0;
 wickets=0;
 balls=0;
 target=0;
 gameOver=false;
 active=true;
 ballFlying=false;
 $("startScreen").style.display="none";
 updateUI();
 say("PLAYER 1 BATTING!");
 nextBallTimer=1;
}

function newBall(){
 if(!active || gameOver || ballFlying)return;

 ballFlying=true;
 hitDone=false;
 ballZ=-7;
 ballX=(Math.random()-.5)*.5;
 ballY=1.15;
 ball.position.set(ballX,ballY,ballZ);
 ball.visible=true;
 say("BOWLER DELIVERS!");
}

function finishBall(runs,isWicket){
 ballFlying=false;
 ball.visible=false;
 balls++;

 if(isWicket){
  wickets++;
  say("OUT! WICKET!");
 }else{
  score+=runs;
  say(runs===0?"DOT BALL!":runs+" RUNS!");
 }

 updateUI();

 if(inning===2 && score>=target){
  endMatch(true);
  return;
 }

 if(balls>=6 || wickets>=2){
  if(inning===1){
   target=score+1;
   inning=2;
   score=0;
   wickets=0;
   balls=0;
   updateUI();
   say("INNINGS BREAK! PLAYER 2 BATTING");
   nextBallTimer=2.5;
  }else{
   endMatch(false);
  }
  return;
 }

 nextBallTimer=1.7;
}

function endMatch(chaseWon){
 gameOver=true;
 active=false;
 let result;
 if(chaseWon) result="PLAYER 2 WINS! 🏆";
 else if(score===target-1) result="MATCH TIED!";
 else result="PLAYER 1 WINS! 🏆";

 say(result);
 $("startScreen").style.display="flex";
 $("start").textContent="PLAY AGAIN ↻";
 $("startScreen").querySelector("h1").textContent=result;
 $("startScreen").querySelector("p").innerHTML=
 "Final Score<br>Player 1 target: "+target+
 "<br>Player 2 score: "+score;
}

function shoot(){
 if(!active || gameOver || !ballFlying || hitDone)return;

 if(ballZ < -3.7 || ballZ > 4.2)return;

 hitDone=true;
 swingTime=.35;

 const timing=Math.abs(ballZ-1.3);
 let runs=0;

 if(timing<.65) runs= Math.random()<.55?6:4;
 else if(timing<1.5) runs=Math.random()<.5?2:4;
 else if(timing<2.5) runs=Math.random()<.5?1:2;
 else runs=0;

 if(runs===0){
  hitVelocity=0;
  finishBall(0,true);
  return;
 }

 finishBall(runs,false);

 // Show a flying ball after a successful shot
 ball.visible=true;
 ball.position.set(ballX,1.5,3.5);
 let t=0;
 const fly=()=>{
  if(t>1){
   ball.visible=false;
   return;
  }
  t+=.035;
  ball.position.x=ballX+Math.sin(t*3)*t*2;
  ball.position.y=1.5+Math.sin(t*Math.PI)*4;
  ball.position.z=3.5-t*13;
  requestAnimationFrame(fly);
 };
 fly();
}

// Controls
$("shot").addEventListener("click",shoot);
$("start").addEventListener("click",startMatch);

addEventListener("keydown",e=>{
 if(e.code==="Space"){
  e.preventDefault();
  shoot();
 }
});

// Animation
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(active && ballFlying && !hitDone){
  ballZ+=dt*8;
  ball.position.z=ballZ;
  ball.position.y=1.15+Math.sin(ballZ*.3)*.13;

  if(ballZ>4.5){
   finishBall(0,false);
  }
 }

 if(active && !ballFlying){
  nextBallTimer-=dt;
  if(nextBallTimer<=0)newBall();
 }

 if(swingTime>0){
  swingTime-=dt;
  batPivot.rotation.x=-Math.sin(swingTime*9)*1.5;
 }else{
  batPivot.rotation.x=0;
 }

 // Camera subtle movement
 camera.position.x=Math.sin(clock.elapsedTime*.15)*.15;
 camera.lookAt(0,1,-1);

 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
